<!DOCTYPE html>
<html>

<body>

<button onclick="save()">Create Category</button>

<pre id="r"></pre>

<script>

function save(){

fetch("http://localhost:3000/categories",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
name:"Perfume",
slug:"perfume"
})
})
.then(r=>r.json())
.then(d=>{
document.getElementById("r").innerHTML=
JSON.stringify(d,null,2)
})

}

</script>

</body>
</html>
